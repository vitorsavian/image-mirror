- GithubRelease:
    Artifacts:
    - SourceArtifact: coredns/coredns
    LatestOnly: true
    Owner: coredns
    Repository: coredns
    VersionRegex: ^v(.*)
  Name: coredns
  Reviewers:
  - k3s-io/k3s
- GithubRelease:
    Artifacts:
    - SourceArtifact: registry.k8s.io/metrics-server/metrics-server
      TargetArtifactName: mirrored-metrics-server
    LatestOnly: true
    Owner: kubernetes-sigs
    Repository: metrics-server
  Name: metrics-server
  Reviewers:
  - k3s-io/k3s
- Name: traefik3
  Registry:
    Artifacts:
    - SourceArtifact: library/traefik
    Latest: true
    VersionFilter: ^3.[0-9]+.[0-9]+$
  Reviewers:
  - k3s-io/k3s
