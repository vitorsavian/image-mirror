name: Mirror images

on:
  push:
    branches: [master]
    paths: ['regsync.yaml']
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  REGSYNC_VERSION: v0.11.6
  REGSYNC_SHA256: 138aed7deddea6e4d34bdc98d0111bd03927a430caa47b47b22081cd57e4fced

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install regsync
        run: |
          curl -fsSL -o regsync \
            "https://github.com/regclient/regclient/releases/download/${REGSYNC_VERSION}/regsync-linux-amd64"
          echo "${REGSYNC_SHA256}  regsync" | sha256sum -c -
          chmod +x regsync

      - name: Aim the copy at this repository's own namespace
        # A no-op here, where the owner is already k3s-io. In a fork it rewrites
        # the targets to the fork's namespace, so the whole thing - pushing,
        # package creation, the visibility check - can be exercised for real
        # before any of it runs under k3s-io. regsync.yaml itself stays literal.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed "s|ghcr\.io/k3s-io/|ghcr.io/${owner}/|" regsync.yaml > sync.yaml
          diff regsync.yaml sync.yaml || echo "(targets rewritten for ${owner})"

      - name: Mirror
        env:
          # The workflow's own token is enough to push to packages owned by this
          # repository's org, so nothing has to be stored for the target side.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Not `--missing`: that skips any tag the target already has, without
        # looking at it. If upstream rebuilds a tag - official images do get
        # rebuilt - the mirror would keep serving the old bytes forever. Plain
        # `once` compares digests, so the mirror converges on upstream.
        run: ./regsync --config sync.yaml once

      - name: Every mirrored package must be pullable anonymously
        # GHCR creates a package the first time something is pushed to it, and it
        # creates it private. Somebody has to flip it to public in the packages
        # settings afterwards; there is no API to do it at push time. Anonymous
        # callers get 403 from the token endpoint for both a private package and
        # one that does not exist, and 200 for a public one, so this is the whole
        # check. It cannot run before the push, because until then those two
        # cases are indistinguishable.
        run: |
          status=0
          repos=$(grep -oE 'target: ghcr\.io/\S+' sync.yaml \
            | cut -d/ -f2- | cut -d: -f1 | sort -u)
          for repo in $repos; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull")
            if [ "$code" = "200" ]; then
              echo "public   ${repo}"
            else
              echo "PRIVATE  ${repo} (token endpoint returned ${code})"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo
            echo "Make them public under" \
              "https://github.com/${{ github.repository_owner }}?tab=packages"
          fi
          exit "$status"
