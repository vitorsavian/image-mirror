name: Pull request

on:
  pull_request:
    paths: ['regsync.yaml', '.github/workflows/**']

env:
  REGSYNC_VERSION: v0.11.6
  REGSYNC_SHA256: 138aed7deddea6e4d34bdc98d0111bd03927a430caa47b47b22081cd57e4fced

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install regsync
        run: |
          curl -fsSL -o regsync \
            "https://github.com/regclient/regclient/releases/download/${REGSYNC_VERSION}/regsync-linux-amd64"
          echo "${REGSYNC_SHA256}  regsync" | sha256sum -c -
          chmod +x regsync

      - name: Config is valid
        run: ./regsync --config regsync.yaml config

      - name: Aim the comparison at this repository's own namespace
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed "s|ghcr\.io/k3s-io/|ghcr.io/${owner}/|" regsync.yaml > sync.yaml

      - name: Every tag exists upstream
        # `check` fails if a source tag cannot be resolved, which is what catches
        # a typo. Tags missing from the target are only reported, not an error -
        # that is the normal state for whatever this pull request is adding.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./regsync --config sync.yaml check
